<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit - EasyMath</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="page-hidden">
    <div class="auth-loader" id="auth-loader">
        <div style="width:40px;height:40px;border:3px solid #222;border-top-color:#FF4D00;border-radius:50%;animation:auth-spin 0.8s linear infinite"></div>
    </div>
    <header>
        <div class="container nav-container" style="max-width: 100%; padding: 0 32px;">
            <a href="app.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#FF4D00" />
                            <stop offset="100%" stop-color="#FF4D00" />
                        </linearGradient>
                    </defs>
                    <path d="M4 19l16-14M4 5l16 14M2 12h20"></path>
                </svg>
                EasyMath
            </a>
            <div class="nav-links">
                <a href="#" id="back-btn" style="color: white; font-weight: 500;">&larr; Back to Subject</a>
            </div>
        </div>
    </header>

    <main class="container min-h-screen" style="padding-top: 100px; padding-bottom: 60px;">
        <!-- Breadcrumb -->
        <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 0.95rem;" id="breadcrumb">
            <a href="app.html" style="color: var(--primary-color); text-decoration: none;">Subjects</a> &gt; Loading...
        </p>

        <h2 id="unit-title" style="font-size: 2.5rem; margin-bottom: 8px;">
            <div class="loader-container">
                <div class="loader"></div>
            </div>
        </h2>
        <p style="color: var(--text-secondary); margin-bottom: 32px;">Select a chapter to start learning</p>

        <div style="display: grid; grid-template-columns: 1fr; gap: 16px;" id="chapters-container">
            <!-- Dynamic Chapters -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/student/unit.js"></script>
</body>

</html>
