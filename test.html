<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Test - EasyMath</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: var(--bg-color);
        }

        .test-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .timer {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 8px 24px;
            border-radius: 30px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            letter-spacing: 2px;
        }

        .timer.warning {
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            from {
                box-shadow: 0 0 0 rgba(239, 68, 68, 0);
            }

            to {
                box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            }
        }

        .test-layout {
            display: flex;
            margin-top: 80px;
            height: calc(100vh - 80px);
        }

        .question-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        .palette-sidebar {
            width: 320px;
            background: var(--bg-surface);
            border-left: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .q-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .q-circle {
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--border-color);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .q-circle:hover {
            border-color: var(--text-secondary);
        }

        .q-circle.current {
            border-color: var(--secondary-color);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
        }

        .q-circle.answered {
            background: rgba(245, 158, 11, 0.8);
            color: white;
            border-color: #f59e0b;
        }

        .q-circle.marked {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.15);
        }

        .q-circle.answered.marked {
            background: rgba(168, 85, 247, 0.8);
            border-color: #a855f7;
        }

        .option-btn {
            display: flex;
            align-items: center;
            width: 100%;
            text-align: left;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            margin-bottom: 12px;
            color: var(--text-primary);
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Outfit', sans-serif;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .option-btn .opt-letter {
            font-weight: 700;
            margin-right: 16px;
            color: var(--text-secondary);
            min-width: 20px;
        }

        .option-btn.selected {
            background: rgba(139, 92, 246, 0.15);
            border-color: var(--primary-color);
        }

        .option-btn.selected .opt-letter {
            color: var(--primary-color);
        }

        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .legend-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            .palette-sidebar {
                display: none;
            }

            .test-layout {
                flex-direction: column;
            }
        }
    </style>
</head>

<body class="page-hidden">
    <div class="auth-loader" id="auth-loader">
        <div style="width:40px;height:40px;border:3px solid #222;border-top-color:#FF4D00;border-radius:50%;animation:auth-spin 0.8s linear infinite"></div>
    </div>
    <!-- Setup Screen -->
    <div id="setup-view" class="flex-center" style="height: 100vh;">
        <div class="glass-panel" style="padding: 48px; text-align: center; max-width: 500px;">
            <div style="font-size: 3rem; margin-bottom: 16px;">“</div>
            <h2 style="font-size: 2rem; margin-bottom: 16px;">Chapter Test</h2>
            <p id="setup-message" style="color: var(--text-secondary); margin-bottom: 32px; line-height: 1.8;">Preparing
                your test...</p>
            <div id="loader" class="loader" style="margin: 0 auto;"></div>
            <button id="start-btn" class="btn btn-primary"
                style="display: none; padding: 16px 40px; font-size: 1.1rem; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);"
                onclick="startTest()">Start Evaluated Test</button>
            <p id="setup-error" style="color: var(--error-color); margin-top: 16px; display: none;"></p>
        </div>
    </div>

    <!-- Test View -->
    <div id="test-view" style="display: none;">
        <header class="test-header">
            <h3 id="test-title" style="margin: 0; font-size: 1.1rem;">Chapter Test</h3>
            <div class="timer" id="timer-display">00:00</div>
            <button class="btn btn-primary"
                style="background: var(--error-color); box-shadow: none; padding: 10px 24px;"
                onclick="submitTest()">Submit Test</button>
        </header>

        <div class="test-layout">
            <main class="question-area">
                <div style="max-width: 800px; margin: 0 auto; padding-bottom: 120px;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px;">
                        <h2 style="font-size: 1.4rem;" id="q-no">Question 1</h2>
                        <span id="q-meta"
                            style="font-size: 0.8rem; color: var(--text-secondary); padding: 4px 12px; background: rgba(255,255,255,0.05); border-radius: 20px;"></span>
                    </div>

                    <p id="q-text" style="font-size: 1.3rem; line-height: 1.7; margin-bottom: 36px;"></p>

                    <div id="options-container">
                        <button class="option-btn" data-opt="a" onclick="selectOption('a')">
                            <span class="opt-letter">A</span><span id="opt-a-text"></span></button>
                        <button class="option-btn" data-opt="b" onclick="selectOption('b')">
                            <span class="opt-letter">B</span><span id="opt-b-text"></span></button>
                        <button class="option-btn" data-opt="c" onclick="selectOption('c')">
                            <span class="opt-letter">C</span><span id="opt-c-text"></span></button>
                        <button class="option-btn" data-opt="d" onclick="selectOption('d')">
                            <span class="opt-letter">D</span><span id="opt-d-text"></span></button>
                    </div>
                </div>

                <div class="bottom-bar">
                    <button class="btn btn-outline" id="prev-btn" onclick="navQuestion(-1)">&larr; Previous</button>
                    <div style="display: flex; gap: 12px;">
                        <button class="btn btn-outline" style="color: var(--text-secondary);"
                            onclick="clearResponse()">Clear Response</button>
                        <button class="btn btn-outline" style="border-color: #a855f7; color: #a855f7;"
                            onclick="toggleMark()">🔖 Mark for Review</button>
                    </div>
                    <button class="btn btn-primary" id="next-btn" onclick="navQuestion(1)">Next &rarr;</button>
                </div>
            </main>

            <aside class="palette-sidebar">
                <h4
                    style="margin-bottom: 12px; color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">
                    Question Palette</h4>

                <div class="legend-row">
                    <div class="legend-item">
                        <div class="legend-dot"
                            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border-color);"></div> Not
                        Visited
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background: rgba(245, 158, 11, 0.8);"></div> Answered
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot"
                            style="background: rgba(168, 85, 247, 0.15); border: 1px solid #a855f7;"></div> Marked
                    </div>
                </div>

                <div class="q-grid" id="q-grid"></div>

                <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-color);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span style="color: var(--text-secondary); font-size: 0.9rem;">Answered</span>
                        <span id="stat-ans" style="font-weight: 700; color: #f59e0b;">0</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span style="color: var(--text-secondary); font-size: 0.9rem;">Marked</span>
                        <span id="stat-mark" style="font-weight: 700; color: #a855f7;">0</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: var(--text-secondary); font-size: 0.9rem;">Not Visited</span>
                        <span id="stat-unvis" style="font-weight: 700;">0</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Submit Overlay -->
    <div id="submitting-overlay" class="flex-center"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column;">
        <div class="loader" style="margin-bottom: 24px;"></div>
        <h2 style="font-size: 2rem;">Evaluating Answers...</h2>
        <p style="color: var(--text-secondary);">Please wait while we calculate your score.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/student/test.js"></script>
</body>

</html>
