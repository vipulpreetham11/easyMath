<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus Builder - Admin - EasyMath</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root {
            --primary-color: #3b82f6;
            /* Blue for admin */
        }

        .list-item {
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .list-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .list-item.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        /* Modal setup */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--bg-surface);
            padding: 32px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .item-actions button {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
        }

        .item-actions button:hover {
            color: var(--text-primary);
        }
    </style>
</head>

<body class="page-hidden">
    <div class="auth-loader" id="auth-loader">
        <div style="width:40px;height:40px;border:3px solid #222;border-top-color:#FF4D00;border-radius:50%;animation:auth-spin 0.8s linear infinite"></div>
    </div>
    <header>
        <div class="container nav-container" style="max-width: 100%; padding: 0 32px;">
            <a href="index.html" class="logo">
                EasyMath <span
                    style="font-size: 0.9rem; background: var(--bg-surface-light); padding: 4px 8px; border-radius: 6px; margin-left: 8px; font-weight: 500;">Admin</span>
            </a>
            <div class="nav-links">
                <span class="user-role-display">Role Dashboard</span>
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="user-card">
                <div class="user-avatar user-avatar-initial" style="background-color: var(--primary-color);">A</div>
                <div>
                    <div style="font-weight: 600; font-size: 0.95rem; color: white;" class="user-name-display">
                        Loading...</div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary);" class="user-role-display">Admin</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Dashboard
                </a>
                <a href="syllabus.html" class="sidebar-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    Syllabus Builder
                </a>
                <a href="notes.html" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Content / Notes
                </a>
                <a href="questions.html" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    Questions Meta
                </a>
                <a href="tests.html" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <circle cx="10" cy="13" r="2"></circle>
                        <line x1="14" y1="13" x2="14" y2="13"></line>
                    </svg>
                    Test Tests Config
                </a>
                <div style="margin-top: auto; padding-top: 24px;"></div>
                <a href="#" id="logout-btn" class="sidebar-item" style="color: var(--error-color);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Sign Out
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <h2 style="font-size: 2rem; margin-bottom: 8px;">Syllabus Builder</h2>
            <p style="color: var(--text-secondary); margin-bottom: 32px;">Manage subjects, units, and chapters
                hierarchy.</p>

            <div style="display: flex; gap: 24px; height: calc(100vh - 200px);">
                <!-- Subjects Column -->
                <div class="glass-panel" style="flex: 1; padding: 24px; display: flex; flex-direction: column;">
                    <div class="column-header">
                        <h3>Subjects</h3>
                        <button class="btn btn-primary" style="padding: 6px 12px; font-size: 0.9rem;"
                            onclick="openModal('subject')">+ Add</button>
                    </div>
                    <div id="subjects-list" style="overflow-y: auto; flex: 1; margin-right: -8px; padding-right: 8px;">
                        <div class="text-center" style="color: var(--text-secondary); margin-top: 20px;">Loading...
                        </div>
                    </div>
                </div>

                <!-- Units Column -->
                <div class="glass-panel"
                    style="flex: 1; padding: 24px; display: flex; flex-direction: column; opacity: 0.5;" id="units-col">
                    <div class="column-header">
                        <h3>Units</h3>
                        <button class="btn btn-primary" style="padding: 6px 12px; font-size: 0.9rem;" id="add-unit-btn"
                            disabled onclick="openModal('unit')">+ Add</button>
                    </div>
                    <div id="units-list" style="overflow-y: auto; flex: 1; margin-right: -8px; padding-right: 8px;">
                        <div class="text-center" style="color: var(--text-secondary); margin-top: 20px;">Select a
                            subject</div>
                    </div>
                </div>

                <!-- Chapters Column -->
                <div class="glass-panel"
                    style="flex: 1; padding: 24px; display: flex; flex-direction: column; opacity: 0.5;"
                    id="chapters-col">
                    <div class="column-header">
                        <h3>Chapters</h3>
                        <button class="btn btn-primary" style="padding: 6px 12px; font-size: 0.9rem;"
                            id="add-chapter-btn" disabled onclick="openModal('chapter')">+ Add</button>
                    </div>
                    <div id="chapters-list" style="overflow-y: auto; flex: 1; margin-right: -8px; padding-right: 8px;">
                        <div class="text-center" style="color: var(--text-secondary); margin-top: 20px;">Select a unit
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="form-modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-bottom: 24px; font-size: 1.5rem;">Add Item</h3>
            <form id="crud-form">
                <input type="hidden" id="form-type">
                <input type="hidden" id="form-id">

                <div class="input-group">
                    <label>Name</label>
                    <input type="text" id="input-name" required placeholder="e.g. Mathematics">
                </div>

                <div class="input-group hidden" id="group-slug">
                    <label>Slug (URL friendly)</label>
                    <input type="text" id="input-slug" placeholder="e.g. maths">
                </div>

                <div class="input-group hidden" id="group-desc">
                    <label>Description (Optional)</label>
                    <textarea id="input-desc" rows="3" placeholder="Chapter description..."></textarea>
                </div>

                <div class="input-group">
                    <label>Order Index</label>
                    <input type="number" id="input-order" value="0" required>
                </div>

                <div class="input-group" style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="input-active" checked style="width: auto;">
                    <label style="margin: 0;">Is Active (Visible to students)</label>
                </div>

                <div id="modal-error" style="color: var(--error-color); margin-bottom: 16px; display: none;"></div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="modal-submit-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin/syllabus.js"></script>
</body>

</html>
