<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EasyMath</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root {
            --primary-color: #3b82f6;
            /* Blue for admin */
            --primary-glow: rgba(59, 130, 246, 0.4);
        }
    </style>
</head>

<body class="page-hidden">
    <div class="auth-loader" id="auth-loader">
        <div style="width:40px;height:40px;border:3px solid #222;border-top-color:#FF4D00;border-radius:50%;animation:auth-spin 0.8s linear infinite"></div>
    </div>
    <header>
        <div class="container nav-container" style="max-width: 100%; padding: 0 32px;">
            <a href="index.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19l16-14M4 5l16 14M2 12h20"></path>
                </svg>
                EasyMath <span
                    style="font-size: 0.9rem; background: var(--bg-surface-light); padding: 4px 8px; border-radius: 6px; margin-left: 8px; font-weight: 500;">Admin</span>
            </a>
            <div class="nav-links">
                <span style="color: var(--text-secondary);" class="user-role-display">Role Dashboard</span>
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="user-card">
                <div class="user-avatar user-avatar-initial" style="background-color: var(--primary-color);">A</div>
                <div>
                    <div style="font-weight: 600; font-size: 0.95rem; color: white;" class="user-name-display">
                        Loading...</div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary);" class="user-role-display">Admin Role
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="sidebar-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Dashboard
                </a>
                <a href="syllabus.html" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    Syllabus Builder
                </a>
                <a href="notes.html" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Content / Notes
                </a>
                <a href="questions.html" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    Questions Meta
                </a>
                <div style="margin-top: auto; padding-top: 24px;"></div>
                <a href="#" id="logout-btn" class="sidebar-item" style="color: var(--error-color);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Sign Out
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <h2 style="font-size: 2rem; margin-bottom: 8px;">Admin Dashboard</h2>
            <p style="color: var(--text-secondary); margin-bottom: 32px;">Manage syllabus, content, and test
                configurations from here.</p>

            <div
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; margin-bottom: 32px;">
                <div class="glass-panel" style="padding: 24px;">
                    <h3 style="color: var(--text-secondary); font-size: 1rem; margin-bottom: 8px;">Total Subjects</h3>
                    <h2 id="stat-subjects" style="font-size: 2.5rem; color: var(--text-primary); margin: 0;">--</h2>
                </div>
                <div class="glass-panel" style="padding: 24px;">
                    <h3 style="color: var(--text-secondary); font-size: 1rem; margin-bottom: 8px;">Total Chapters</h3>
                    <h2 id="stat-chapters" style="font-size: 2.5rem; color: var(--text-primary); margin: 0;">--</h2>
                </div>
                <div class="glass-panel" style="padding: 24px;">
                    <h3 style="color: var(--text-secondary); font-size: 1rem; margin-bottom: 8px;">Active Questions</h3>
                    <h2 id="stat-questions" style="font-size: 2.5rem; color: var(--text-primary); margin: 0;">--</h2>
                </div>
            </div>

        </main>
    </div>

    <!-- Supabase SDK (path needs to adjust for subfolders) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Add a small delay for session check if needed
            setTimeout(loadDashboardStats, 600);
        });

        async function loadDashboardStats() {
            try {
                // Total Subjects
                const { count: subjectsCount } = await window.supabaseClient
                    .from('subjects')
                    .select('*', { count: 'exact', head: true });

                if (subjectsCount !== null) {
                    document.getElementById('stat-subjects').textContent = subjectsCount;
                } else {
                    document.getElementById('stat-subjects').textContent = '0';
                }

                // Total Chapters
                const { count: chaptersCount } = await window.supabaseClient
                    .from('chapters')
                    .select('*', { count: 'exact', head: true });

                if (chaptersCount !== null) {
                    document.getElementById('stat-chapters').textContent = chaptersCount;
                } else {
                    document.getElementById('stat-chapters').textContent = '0';
                }

                // Active Questions
                const { count: questionsCount } = await window.supabaseClient
                    .from('questions')
                    .select('*', { count: 'exact', head: true })
                    .eq('is_active', true);

                if (questionsCount !== null) {
                    document.getElementById('stat-questions').textContent = questionsCount;
                } else {
                    document.getElementById('stat-questions').textContent = '0';
                }
            } catch (error) {
                console.error("Error loading dashboard stats:", error);
            }
        }
    </script>
</body>

</html>
