<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - EasyMath</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 77, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(255, 133, 51, 0.15) 0%, transparent 50%);
        }
    </style>
</head>
<body class="flex-center min-h-screen page-hidden">

    <div class="auth-loader" id="auth-loader">
        <div style="width:40px;height:40px;
            border:3px solid #222;
            border-top-color:#FF4D00;
            border-radius:50%;
            animation:auth-spin 0.8s linear infinite">
        </div>
    </div>

    <div class="glass-panel" style="width: 100%; max-width: 440px; text-align: center; position: relative;">
        <!-- Loading overlay -->
        <div id="loading-overlay" class="hidden flex-center"
            style="position: absolute; inset: 0; background: rgba(26,23,46,0.8); border-radius: 20px; z-index: 10;">
            <div class="loader"></div>
            <p style="margin-left: 12px; font-weight: 500;">Authenticating...</p>
        </div>

        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 32px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <defs>
                    <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FF4D00" />
                        <stop offset="100%" stop-color="#FF4D00" />
                    </linearGradient>
                </defs>
                <path d="M4 19l16-14M4 5l16 14M2 12h20"></path>
            </svg>
            EasyMath
        </a>

        <h2 style="font-size: 1.8rem; margin-bottom: 12px;">Welcome Back</h2>
        <p style="color: var(--text-secondary); margin-bottom: 32px;">Sign in to continue your learning journey</p>

        <button id="google-login-btn" class="btn btn-google" style="width: 100%; padding: 14px; font-size: 1.05rem;">
            <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg"
                style="margin-right: 8px;">
                <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="#4285F4" />
                <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="#34A853" />
                <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                    fill="#FBBC05" />
                <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="#EA4335" />
                <path d="M1 1h22v22H1z" fill="none" />
            </svg>
            Sign in with Google
        </button>

        <div id="error-message" style="color: var(--error-color); margin-top: 16px; font-size: 0.9rem; display: none;">
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
