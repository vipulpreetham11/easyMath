<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyMath - Master Mathematics Effortlessly</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#FF4D00" />
                            <stop offset="100%" stop-color="#FF4D00" />
                        </linearGradient>
                    </defs>
                    <path d="M4 19l16-14M4 5l16 14M2 12h20"></path>
                </svg>
                EasyMath
            </a>
            <div class="nav-links">
                <a href="#features">Features</a>
                <a href="login.html" class="btn btn-primary" id="login-btn">Sign In</a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero min-h-screen flex-center" style="padding-top: 80px;">
            <div class="container text-center">
                <h1 style="font-size: 4rem; max-width: 800px; margin: 0 auto 24px;">Master Mathematics <br> <span class="text-gradient">With Zero Friction</span></h1>
                <p style="font-size: 1.25rem; color: var(--text-secondary); max-width: 600px; margin: 0 auto 40px;">
                    The ultimate platform with intelligent practice, concise notes, and PYQs tailored for your success.
                </p>
                <div style="display: flex; gap: 16px; justify-content: center;">
                    <a href="login.html" class="btn btn-primary" style="padding: 16px 32px; font-size: 1.1rem;">Get Started for Free</a>
                    <a href="#features" class="btn btn-outline" style="padding: 16px 32px; font-size: 1.1rem;">Explore Features</a>
                </div>
                
                <!-- Mockup image placeholder -->
                <div class="glass-panel" style="margin-top: 60px; height: 400px; border-radius: 24px; position: relative; overflow: hidden; background: linear-gradient(to bottom, rgba(26,23,46,0.8), rgba(12,10,26,1)); border: 1px solid rgba(139, 92, 246, 0.2);">
                    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 40px; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; padding: 0 16px; gap: 8px;">
                        <div style="width: 12px; height: 12px; border-radius: 50%; background: #ef4444;"></div>
                        <div style="width: 12px; height: 12px; border-radius: 50%; background: #f59e0b;"></div>
                        <div style="width: 12px; height: 12px; border-radius: 50%; background: #10b981;"></div>
                    </div>
                    <div style="padding: 60px; height: 100%; display: flex; align-items: center; justify-content: center; opacity: 0.5;">
                        <h2>Interactive Dashboard Preview</h2>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
