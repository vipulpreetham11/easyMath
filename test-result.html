<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Results - EasyMath</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .result-card {
            background: var(--bg-surface);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid var(--glass-border);
            max-width: 800px;
            margin: 0 auto 32px;
            text-align: center;
        }

        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            margin: 0 auto 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border: 8px solid rgba(255, 255, 255, 0.05);
            background: var(--bg-surface-light);
            transition: border-color 0.5s;
        }

        .score-text {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
        }

        .stat-num {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .accuracy-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
            display: flex;
        }

        .acc-correct {
            height: 100%;
            background: #10b981;
            transition: width 0.6s;
        }

        .acc-wrong {
            height: 100%;
            background: #ef4444;
            transition: width 0.6s;
        }

        .acc-skip {
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Question Review Section */
        .review-section {
            max-width: 800px;
            margin: 0 auto;
        }

        .review-card {
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .review-card.correct-card {
            border-left: 4px solid #10b981;
        }

        .review-card.wrong-card {
            border-left: 4px solid #ef4444;
        }

        .review-card.skipped-card {
            border-left: 4px solid var(--text-secondary);
        }

        .review-option {
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .review-option.is-correct {
            background: rgba(16, 185, 129, 0.12);
            color: #6ee7b7;
        }

        .review-option.is-wrong {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
        }

        .review-option .opt-marker {
            font-weight: 700;
            min-width: 18px;
        }

        .review-explanation {
            margin-top: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            background: rgba(59, 130, 246, 0.08);
            border-left: 3px solid var(--secondary-color);
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .review-badge {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-correct {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
        }

        .badge-wrong {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .badge-skipped {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
        }

        @media (max-width: 600px) {
            .stat-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .result-card {
                padding: 24px;
            }
        }
    </style>
    <script>
        const t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
    </script>
</head>

<body class="page-hidden">
    <div class="auth-loader" id="auth-loader">
        <div style="width:40px;height:40px;border:3px solid #222;border-top-color:#FF4D00;border-radius:50%;animation:auth-spin 0.8s linear infinite"></div>
    </div>
    <header>
        <div class="container nav-container" style="max-width: 100%; padding: 0 32px;">
            <a href="app.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#FF4D00" />
                            <stop offset="100%" stop-color="#FF4D00" />
                        </linearGradient>
                    </defs>
                    <path d="M4 19l16-14M4 5l16 14M2 12h20"></path>
                </svg>
                EasyMath
            </a>
            <div class="nav-links">
                <a href="#" id="back-btn" style="color: white; font-weight: 500;">&larr; Back to Chapter</a>
            </div>
        </div>
    </header>

    <main class="container min-h-screen" style="padding-top: 100px; padding-bottom: 60px;">
        <div id="loader-state" class="flex-center" style="min-height: 400px;">
            <div style="text-align: center;">
                <div class="loader" style="margin: 0 auto 24px;"></div>
                <p style="color: var(--text-secondary);" id="load-msg">Loading your results...</p>
            </div>
        </div>

        <div id="result-view" style="display: none;">
            <!-- Score Card -->
            <div class="result-card">
                <h2 style="font-size: 2rem; margin-bottom: 4px;" id="r-title">Test Completed!</h2>
                <p style="color: var(--text-secondary); margin-bottom: 32px;" id="r-subtitle">Here's how you performed.
                </p>

                <div class="score-circle" id="score-circle">
                    <div class="score-text" id="r-percent">--%</div>
                    <div
                        style="font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; margin-top: 4px;">
                        Score</div>
                </div>

                <h3 style="font-size: 1.5rem; margin-bottom: 32px;">
                    <span id="r-score-val" style="color: var(--primary-color);">0</span> out of
                    <span id="r-total-marks">0</span> Marks
                </h3>

                <div class="stat-grid">
                    <div class="stat-box">
                        <div class="stat-num" id="r-attempted" style="color: var(--text-primary);">0</div>
                        <div class="stat-label">Attempted</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num" id="r-correct" style="color: #10b981;">0</div>
                        <div class="stat-label">Correct</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num" id="r-wrong" style="color: #ef4444;">0</div>
                        <div class="stat-label">Incorrect</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num" id="r-time" style="color: var(--secondary-color);">0m</div>
                        <div class="stat-label">Time Used</div>
                    </div>
                </div>

                <div
                    style="text-align: left; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 16px; margin-bottom: 32px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span style="font-weight: 500;">Accuracy</span>
                        <span id="r-acc-text">0%</span>
                    </div>
                    <div class="accuracy-bar">
                        <div class="acc-correct" id="bar-correct" style="width: 0%;"></div>
                        <div class="acc-wrong" id="bar-wrong" style="width: 0%;"></div>
                        <div class="acc-skip" id="bar-skip" style="width: 100%;"></div>
                    </div>
                </div>

                <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
                    <button class="btn btn-outline" onclick="window.location.href='home.html'">Home Dashboard</button>
                    <button class="btn btn-primary" id="retry-btn">Review Chapter</button>
                </div>
            </div>

            <!-- Question Review -->
            <div class="review-section">
                <h3 style="font-size: 1.3rem; margin-bottom: 20px;">📋 Question-by-Question Review</h3>
                <div id="review-container"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/student/test-result.js"></script>
</body>

</html>
